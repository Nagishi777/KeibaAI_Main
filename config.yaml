# KeibaAI 設定ファイル
# main.py / src.simulator.predict_today / src.simulator.retrain / src.buying.cli が読む。
# 購入の認証情報・金額上限は src/buying/.env に書く（このファイルには書かない）。

data:
  # 着順 data/processed/horses/*_horses.csv の親フォルダ（再学習のラベル）
  parsed_data_dir: data/processed
  # 学習用の月別締切前オッズ YYYYMM_odds_series_tansho.csv の置き場所
  odds_series_output_dir: data/processed/odds_series
  # 予測結果 output/simulator/ と日次レポート output/pipeline/ の親フォルダ
  output_dir: output

model:
  # 学習済みモデルの保存先（data/model/win/win_model.txt 等）
  model_dir: data/model
  # 木の形は src/simulator/retrain.py の WIN_LGBM_PARAMS で上書きされる。
  # ここでは木の本数の上限と early stopping だけを指定する。
  lightgbm:
    n_estimators: 1000
    early_stopping_rounds: 50
  calibration:
    method: isotonic
  # 直近のレースほど重く学習する時間減衰ウェイト
  time_decay:
    recent_years: 2.0
    mid_years: 4.0
    w_recent: 3.0
    w_mid: 2.0

# 単勝モデル戦略の購入条件（docs/report/anaba_strategy_report/anaba_strategy_report.md）
# 既定値は src/simulator/strategy.py が持つ。ここに書けば上書きできる。
strategy:
  min_ev: 1.05               # EV = 予測確率 × 2mオッズ の下限
  odds_min: 10.0             # 2mオッズの下限（これ未満は妙味が小さい）
  odds_max: 150.0            # 2mオッズの上限（これ超は期待値が崩れる）
  max_drift: -0.05           # log(2mオッズ / 5mオッズ) の上限。負=オッズが下がった
  # 総投票額フィルタ。min_pool_pctile を設定するとそちらが優先される。
  #
  # IMPORTANT: 当日データ（JV-Link 速報 0B31）は学習データ（履歴 0B41）より
  #   総票数が 9〜13倍小さい（競馬場を揃えても同じ）。よって履歴で検証した
  #   5億円という絶対額を当日データに当てると1レースも通らない。
  #   詳細は docs/report/pool_by_race_number_report.md §6。
  #
  #   下の 40000000（0.4億円）は、当日データで「その日の上位50%」に
  #   相当する水準である。**ただし当日データは1開催日22レースしか無く、
  #   この値の信頼性は低い。** 開催を重ねてデータが溜まったら測り直すこと。
  #   本来の解決は当日取得を履歴と同じ 0B41 に揃えることである（§6.1 案A）。
  min_pool_yen: 40000000     # 当日(0B31)スケールでの下限（0.4億円 ≒ 日内上位50%）
  #
  # min_pool_pctile: 日内分位点で判定する（絶対額より優先）。
  #   スケール差に影響されない利点があるが、レース単位で判断する
  #   src/pipeline/daily.py の経路では「渡されたレースの中での順位」に
  #   なってしまい、1レースだけだとフィルタが無効化される（警告が出る）。
  #   日次バッチで全レースまとめて判定する場合にのみ有効。
  min_pool_pctile: null
  max_bets_per_race: 1       # 1レースあたりの購入点数（期待値最大の1頭のみ）
  stake_yen: 100             # Flat ベットの1点あたり金額（円）

# 複勝モデル戦略の購入条件
# （docs/report/anaba_strategy_place_report/anaba_place_band_report.md §4・§7.1）
# 既定値は src/simulator/place_strategy.py が持つ。ここに書けば上書きできる。
place_strategy:
  min_ev: 1.05               # 複勝EV = 予測複勝率 × 判断時点の複勝オッズ(min側) の下限
  odds_min: 2.0              # 複勝オッズ(min側)の下限
  odds_max: 20.0             # 複勝オッズ(min側)の上限（20倍超は回収率が崩れる。レポート §3.2）
  max_drift: -0.05           # 単勝の log(判断時点オッズ / 5mオッズ) の上限（単勝版と同じ）
  max_bets_per_race: 3       # 1レース最大3点（期待値の高い順）。.env の BUYING_MAX_BETS_PER_RACE も合わせること
  stake_yen: 100             # Flat ベットの1点あたり金額（円）

# main.py の日次実行
pipeline:
  model_filename: win/win_model.txt
  retrain_start_period: '202301'   # 再学習に使う最初の年月（1m が使えるのは2023年以降）
  place_model_dir: place           # 複勝モデルの保存先（data/model 配下）
  place_retrain_start_period: '202401'   # 複勝モデルの学習開始年月（レポートの指定期間）
  retrain_delay_minutes: 30        # 最終レース発走から再学習を始めるまでの分数

# 単独実行（python -m src.simulator.*）時のログ
logging:
  level: INFO
  file: logs/app.log
